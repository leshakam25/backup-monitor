# Мониторинг бекапов: бот + VPN-клиент AmneziaWG (для доступа к Telegram) + Traefik (HTTPS).
#
#   агенты офисов ──HTTPS──> traefik ──> bot:8080   (приём отчётов, мимо VPN)
#   bot ──HTTP-прокси──> amnezia:8888 ──туннель AmneziaWG──> api.telegram.org
#
# Запуск:  cp .env.example .env && nano .env && docker compose up -d --build

name: backup-monitor

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=backup_web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - web

  amnezia:
    build: ./amnezia
    profiles: [vpn]          # включается через COMPOSE_PROFILES=vpn в .env
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./amnezia/config:/config:ro
    networks:
      - default   # выход в интернет (до VPN-сервера)
      - tg        # бот -> прокси

  bot:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      DB_PATH: /data/backup_bot.sqlite3
      # Чтобы ходить в Telegram напрямую (VDS за границей) — задайте в .env пустое TELEGRAM_PROXY=
      TELEGRAM_PROXY: ${TELEGRAM_PROXY-http://amnezia:8888}
    volumes:
      - bot-data:/data
    depends_on:
      amnezia:
        condition: service_started
        required: false
    networks:
      - web
      - tg
    labels:
      - traefik.enable=true
      - traefik.docker.network=backup_web
      - traefik.http.routers.backupbot.rule=Host(`${DOMAIN}`) && (Path(`/`) || Path(`/backup-agent.zip`) || Path(`/api/report`) || Path(`/api/ping`) || Path(`/health`))
      - traefik.http.routers.backupbot.entrypoints=websecure
      - traefik.http.routers.backupbot.tls.certresolver=le
      - traefik.http.services.backupbot.loadbalancer.server.port=8080

networks:
  default:
  web:
    name: backup_web
  tg:
    internal: true

volumes:
  bot-data:
